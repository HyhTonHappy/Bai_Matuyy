<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match the Words – Mini Game</title>
<style>
:root{
  --ink:#16285c; --green:#1fae4b; --green-d:#138a37; --red:#e53935; --blue:#1f8fe0;
  --paper:#fffaf0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Baloo 2","Fredoka","Nunito","Trebuchet MS","Segoe UI",Arial,sans-serif;
  color:var(--ink); min-height:100vh;
  background:
    radial-gradient(circle at 8% 4%, #d6ecff 0 90px, transparent 91px),
    radial-gradient(circle at 96% 98%, #fff0c2 0 120px, transparent 121px),
    radial-gradient(circle at 2% 96%, #dcefff 0 110px, transparent 111px),
    #fff8ec;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:14px 16px 36px}

/* ---------- Top bar ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stars{display:flex;gap:4px;font-size:clamp(22px,3.2vw,32px)}
.stars span{filter:grayscale(1) opacity(.35);transition:filter .4s, transform .4s}
.stars span.on{filter:none;transform:scale(1.15);animation:starPop .6s}
@keyframes starPop{0%{transform:scale(.3) rotate(-40deg)}60%{transform:scale(1.5) rotate(10deg)}100%{transform:scale(1.15)}}
.tools{display:flex;gap:8px;align-items:center}
.chip{background:#fff;border:2px solid #f0dfc0;border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px;box-shadow:0 3px 0 #f0dfc0}
.ibtn{width:44px;height:44px;border-radius:50%;border:none;background:#fff;box-shadow:0 3px 0 #e9d2a8,0 4px 10px rgba(0,0,0,.08);font-size:20px;cursor:pointer;transition:transform .15s}
.ibtn:hover{transform:translateY(-2px)}
.ibtn:active{transform:translateY(1px)}

/* ---------- Banner ---------- */
.banner{position:relative;display:flex;align-items:center;gap:clamp(10px,2vw,22px);
  background:linear-gradient(180deg,#f9e3bb,#efc88b);border-radius:24px;padding:clamp(10px,1.6vw,16px) clamp(14px,2.4vw,26px);
  box-shadow:0 6px 0 #d8a660,0 12px 24px rgba(160,110,40,.18);transform:rotate(-.5deg)}
.banner::before{content:"";position:absolute;inset:6px;border-radius:18px;border:2px dashed rgba(160,110,40,.25);pointer-events:none}
.banner .no{flex:none;width:clamp(44px,7vw,72px);aspect-ratio:1;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:clamp(24px,4vw,42px);font-weight:900;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15),0 4px 0 #1667a8}
.banner h1{margin:0;font-size:clamp(19px,3.4vw,38px);line-height:1.12;font-weight:900;letter-spacing:.2px}
.banner .bulb{margin-left:auto;font-size:clamp(28px,4.4vw,48px);animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg) scale(1.08)}}
.hint{margin:16px 4px 4px;font-size:clamp(14px,1.8vw,18px);font-weight:700;color:#5a4a2a;display:flex;gap:8px;align-items:flex-start}
.hint small{display:block;font-weight:600;color:#8a7650}

/* ---------- Board ---------- */
.board{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.32fr);
  column-gap:clamp(40px,9vw,120px);row-gap:clamp(10px,1.8vw,18px);margin-top:14px}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6;overflow:visible}

.word{position:relative;grid-column:1;display:flex;align-items:center;gap:clamp(6px,1.4vw,14px);
  border-radius:22px;border:3px dashed var(--bd);background:var(--bg);padding:clamp(6px,1.2vw,12px) clamp(10px,2vw,22px) clamp(6px,1.2vw,12px) clamp(8px,1.4vw,14px);
  cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;
  box-shadow:0 5px 0 var(--bd);transition:transform .18s, box-shadow .18s, border-color .2s}
.word:hover{transform:translateY(-3px)}
.word .num{flex:none;width:clamp(30px,4.4vw,48px);aspect-ratio:1;border-radius:50%;background:var(--strong);color:#fff;display:grid;place-items:center;font-weight:900;font-size:clamp(15px,2.4vw,26px);
  box-shadow:0 0 0 4px rgba(255,255,255,.7)}
.word .icon{flex:none;font-size:clamp(26px,4.8vw,56px);line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.08));transition:transform .3s}
.word .txt{flex:1;min-width:0;font-weight:900;font-size:clamp(16px,2.8vw,34px);line-height:1.05;text-align:center;overflow-wrap:break-word}
.word.selected{transform:scale(1.04);border-style:solid;border-color:var(--blue);box-shadow:0 0 0 5px rgba(31,143,224,.25),0 6px 0 #1667a8}
.word.selected .icon{animation:bounce .6s ease-in-out infinite alternate}
@keyframes bounce{to{transform:translateY(-6px) rotate(8deg)}}
.word.matched{border-style:solid;border-color:var(--green);box-shadow:0 5px 0 var(--green-d);cursor:default}
.word.matched:hover{transform:none}

.c-pink{--bg:#ffe0ec;--bd:#f5a9c6;--strong:#f0507f}
.c-green{--bg:#ddf6d6;--bd:#a4dc95;--strong:#38a845}
.c-blue{--bg:#dbeeff;--bd:#a2caf2;--strong:#2468b8}
.c-purple{--bg:#ede2ff;--bd:#c6adf2;--strong:#8a55d6}
.c-yellow{--bg:#fff5cc;--bd:#f0d77c;--strong:#f08a1c}

.pic{position:relative;grid-column:2;aspect-ratio:2.25/1;border-radius:22px;border:4px solid var(--bd);background:#fff;cursor:pointer;
  box-shadow:0 5px 0 var(--bd),0 8px 18px rgba(0,0,0,.08);transition:transform .2s, box-shadow .2s, border-color .2s}
.pic .imgbox{position:absolute;inset:0;border-radius:18px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.pic:hover{transform:translateY(-3px)}
.pic:hover img{transform:scale(1.06)}
.pic.target{box-shadow:0 0 0 5px rgba(31,143,224,.35),0 5px 0 var(--bd)}
.pic .letter{position:absolute;left:10px;top:8px;z-index:3;width:clamp(30px,4.2vw,46px);aspect-ratio:1;border-radius:50%;background:#fff;color:var(--strong);
  display:grid;place-items:center;font-weight:900;font-size:clamp(17px,2.6vw,28px);box-shadow:0 0 0 4px var(--bd),0 3px 8px rgba(0,0,0,.2)}
.pic.matched{border-color:var(--green);box-shadow:0 5px 0 var(--green-d)}
.pic .replay{position:absolute;right:10px;bottom:10px;z-index:3;background:rgba(255,255,255,.95);color:var(--green-d);font-weight:900;font-size:clamp(11px,1.5vw,15px);
  border-radius:999px;padding:4px 12px;box-shadow:0 3px 8px rgba(0,0,0,.2);display:none;animation:pulseBtn 1.4s ease-in-out infinite}
.pic.matched .replay{display:block}
@keyframes pulseBtn{50%{transform:scale(1.08)}}

.dot{position:absolute;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:#fff;border:4px solid var(--ink);z-index:7;transition:background .2s,border-color .2s}
.word .dot{right:-12px}
.pic .dot{left:-12px}
.matched .dot{background:var(--green);border-color:var(--green-d)}
.word.selected .dot{background:var(--blue);border-color:#1667a8;animation:dotPulse .8s infinite}
@keyframes dotPulse{50%{box-shadow:0 0 0 8px rgba(31,143,224,.25)}}

.mark{position:absolute;top:-14px;right:-14px;z-index:8;width:clamp(36px,4.6vw,50px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;
  font-size:clamp(20px,2.8vw,30px);font-weight:900;border:4px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25);animation:markPop .5s cubic-bezier(.3,1.7,.5,1)}
.mark.ok{background:var(--green)}
.mark.no{background:var(--red)}
@keyframes markPop{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1)}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(6px)}}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);background:var(--ink);color:#fff;font-weight:800;padding:12px 22px;border-radius:999px;
  box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:40;transition:transform .35s cubic-bezier(.3,1.4,.5,1);text-align:center;max-width:92vw;font-size:clamp(14px,1.8vw,18px)}
.toast:not(.show){opacity:0;visibility:hidden;transition:transform .35s, opacity .3s, visibility 0s .35s}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.toast.bad{background:var(--red)}
.toast.good{background:var(--green)}

/* ---------- Overlay ---------- */
.ov{position:fixed;inset:0;background:rgba(18,28,58,.72);display:none;place-items:center;z-index:50;padding:14px}
.ov.show{display:grid;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.ovbox{width:min(940px,100%,calc((100dvh - 170px) * 1.7778));min-width:min(300px,100%);background:#fff;border-radius:26px;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:zoomIn .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes zoomIn{from{transform:scale(.6);opacity:0}}
.stage{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:16/9;background:#cde}
.stage svg{width:100%;height:100%;display:block}
.ovinfo{display:flex;align-items:center;gap:12px;padding:12px 6px 4px;flex-wrap:wrap}
.bigcheck{flex:none;width:58px;height:58px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:34px;font-weight:900;box-shadow:0 4px 0 var(--green-d);animation:markPop .6s cubic-bezier(.3,1.7,.5,1)}
.ovtext{flex:1;min-width:180px}
.ovword{font-size:clamp(22px,3.6vw,36px);font-weight:900;line-height:1.05}
.ovword em{font-style:normal;color:var(--green-d)}
.ovvi{color:#6b5a3a;font-weight:700;font-size:clamp(14px,1.8vw,18px)}
.ovsen{color:#4b5a80;font-weight:600;font-size:clamp(13px,1.7vw,17px);margin-top:2px}
.btn{border:none;border-radius:999px;padding:12px 22px;font-weight:900;font-size:clamp(15px,2vw,19px);cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px)}
.btn.go{background:var(--green);color:#fff;box-shadow:0 5px 0 var(--green-d)}
.btn.soft{background:#eaf4ff;color:#1667a8;box-shadow:0 5px 0 #b9d8f5}
.btn.orange{background:#ff9a1f;color:#fff;box-shadow:0 5px 0 #d06f00}

/* ---------- Win ---------- */
.winbox{width:min(560px,100%);background:#fff;border-radius:28px;padding:26px 22px 24px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:zoomIn .5s cubic-bezier(.3,1.5,.5,1)}
.winbox .trophy{font-size:76px;animation:wiggle 1.6s ease-in-out infinite}
.winbox h2{margin:4px 0 2px;font-size:clamp(28px,5vw,42px);font-weight:900;color:#f08a1c}
.winbox p{margin:6px 0;font-weight:700}
.winstars{font-size:46px;letter-spacing:6px;margin:6px 0}
.winstars span{display:inline-block;animation:starPop .6s both}
.winstars span.off{filter:grayscale(1) opacity(.3)}
.keys{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 18px}
.keys span{background:#ddf6d6;border:2px solid #a4dc95;border-radius:12px;padding:4px 10px;font-weight:800}

.confetti{position:fixed;top:-20px;width:12px;height:16px;z-index:60;pointer-events:none;border-radius:3px;animation:conf linear forwards}
@keyframes conf{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- Scene animations ---------- */
.stage svg [class]{transform-box:fill-box}
/* dogsled */
.sd-team{animation:sdRun 4.4s linear infinite}
@keyframes sdRun{from{transform:translateX(-700px)}to{transform:translateX(880px)}}
.leg{transform-origin:50% 0;animation:leg .26s ease-in-out infinite alternate}
@keyframes leg{from{transform:rotate(-32deg)}to{transform:rotate(32deg)}}
.bob{animation:bob .26s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}
.tail{transform-origin:100% 100%;animation:wag .2s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.flake{animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-30px)}to{transform:translateY(480px)}}
.puff{transform-origin:center;animation:puff .52s ease-out infinite}
@keyframes puff{from{transform:scale(.3);opacity:.95}to{transform:translateX(-26px) scale(1.9);opacity:0}}
.cloud{animation:cloud 16s linear infinite alternate}
@keyframes cloud{to{transform:translateX(120px)}}
.speed{animation:speed .5s linear infinite}
@keyframes speed{from{transform:translateX(0);opacity:.8}to{transform:translateX(-70px);opacity:0}}
/* crafts */
.cr-drop{animation:crDrop 1s cubic-bezier(.3,1.5,.5,1) .3s both}
@keyframes crDrop{from{transform:translateY(-330px) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
.cr-slide{animation:crSlide .9s cubic-bezier(.3,1.4,.5,1) 1s both}
@keyframes crSlide{from{transform:translateX(-430px) rotate(-60deg);opacity:0}to{transform:none;opacity:1}}
.cr-rise{animation:crRise .8s cubic-bezier(.3,1.4,.5,1) 1.7s both}
@keyframes crRise{from{transform:translateY(240px);opacity:0}to{transform:none;opacity:1}}
.pop{transform-origin:center;animation:popIn .55s cubic-bezier(.3,1.7,.5,1) both}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.cr-cut{animation:crCut 2.6s linear infinite}
@keyframes crCut{from{transform:translateX(0)}to{transform:translateX(165px)}}
.cr-snip{transform-origin:center;animation:snip .17s ease-in-out infinite alternate}
@keyframes snip{to{transform:rotate(16deg) scaleY(.82)}}
.cr-bit{transform-origin:center;animation:bitFall 1.6s ease-in infinite}
@keyframes bitFall{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(-24px,250px) rotate(320deg);opacity:0}}
.twinkle{transform-origin:center;animation:twk 1s ease-in-out infinite both}
@keyframes twk{0%,100%{transform:scale(.3);opacity:0}50%{transform:scale(1.25);opacity:1}}
.float{transform-origin:center;animation:flt 1.8s ease-in-out infinite alternate}
@keyframes flt{to{transform:translateY(-10px) rotate(5deg)}}
/* native art */
.na-draw{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw 1.4s ease-in-out both}
@keyframes draw{to{stroke-dashoffset:0}}
.spin{transform-origin:center;animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{transform-origin:center;animation:pulse .9s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(.92)}to{transform:scale(1.12)}}
.na-bx{animation:naBx 1.4s linear both, fadeOut .3s 1.4s both}
@keyframes naBx{from{transform:translateX(0)}to{transform:translateX(800px)}}
@keyframes fadeOut{to{opacity:0}}
.na-by{animation:naBy .467s ease-in-out -.233s infinite alternate}
@keyframes naBy{from{transform:translateY(-28px)}to{transform:translateY(28px)}}
/* weaving */
.wv-row{animation:wvRow .3s linear both}
.wv-row.l{transform-origin:0 50%}
.wv-row.r{transform-origin:100% 50%}
@keyframes wvRow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.wv-up{animation:wvUp 3.9s linear both}
@keyframes wvUp{to{transform:translateY(-312px)}}
.wv-x{animation:wvX .3s linear 13 alternate both}
@keyframes wvX{from{transform:translateX(0)}to{transform:translateX(470px)}}
.wv-done{animation:popIn .5s cubic-bezier(.3,1.7,.5,1) 4s both;transform-origin:center}
/* dance */
.dn-jump{animation:jump .36s ease-out infinite alternate}
@keyframes jump{to{transform:translateY(-28px)}}
.dn-shadow{transform-origin:center;animation:shadow .36s ease-out infinite alternate}
@keyframes shadow{to{transform:scale(.65);opacity:.5}}
.dn-leg{transform-origin:50% 0;animation:dleg .36s ease-in-out infinite alternate}
@keyframes dleg{from{transform:rotate(-20deg)}to{transform:rotate(22deg)}}
.dn-armL{transform-origin:100% 0;animation:armL .36s ease-in-out infinite alternate}
@keyframes armL{from{transform:rotate(-30deg)}to{transform:rotate(35deg)}}
.dn-armR{transform-origin:0 0;animation:armR .18s ease-in-out infinite alternate}
@keyframes armR{from{transform:rotate(-22deg)}to{transform:rotate(10deg)}}
.dn-feather{transform-origin:50% 100%;animation:sway .36s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.dn-ring{transform-origin:center;animation:ring .72s ease-out infinite}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(2.6);opacity:0}}
.dn-boom{transform-origin:center;animation:boom 1.44s ease-out infinite both}
@keyframes boom{0%{transform:scale(0) rotate(-12deg);opacity:0}15%{transform:scale(1.25) rotate(4deg);opacity:1}45%{transform:scale(1);opacity:1}60%,100%{transform:scale(1);opacity:0}}
.note{animation:noteUp 2.6s linear infinite both}
@keyframes noteUp{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-220px) rotate(25deg);opacity:0}}

@media (min-width:700px) and (min-height:560px){
  .pic{aspect-ratio:auto;height:clamp(110px,calc((100dvh - 330px) / 5),230px)}
}
@media (max-width:600px){
  .wrap{padding:10px 10px 30px}
  .board{column-gap:34px}
  .pic{aspect-ratio:1.7/1;border-radius:16px;border-width:3px}
  .pic .imgbox{border-radius:13px}
  .word{border-radius:16px;flex-wrap:wrap;justify-content:center;padding:6px}
  .word .num{position:absolute;left:-8px;top:-8px;width:26px;font-size:14px}
  .word .txt{flex-basis:100%}
  .pic .replay{display:none!important}
  .ovinfo .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){
  .word.selected .icon,.banner .bulb{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="stars" id="stars" aria-label="progress"></div>
    <div class="tools">
      <span class="chip" id="miss">❌ 0</span>
      <button class="ibtn" id="btnSound" title="Bật/tắt âm thanh">🔊</button>
      <button class="ibtn" id="btnFull" title="Toàn màn hình">⛶</button>
      <button class="ibtn" id="btnReset" title="Chơi lại">🔄</button>
    </div>
  </div>

  <div class="banner">
    <div class="no">1</div>
    <h1>Match the words and phrases<br>with the pictures.</h1>
    <div class="bulb">💡</div>
  </div>

  <div class="hint">👉<div>Tap a word, then tap the matching picture — or drag a line!
    <small>Chạm vào một từ rồi chạm vào bức tranh phù hợp, hoặc kéo một đường nối.</small></div></div>

  <div class="board" id="board">
    <svg id="lines"></svg>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="ov" id="ov">
  <div class="ovbox">
    <div class="stage" id="stage"></div>
    <div class="ovinfo">
      <div class="bigcheck">✔</div>
      <div class="ovtext">
        <div class="ovword" id="ovWord"></div>
        <div class="ovvi" id="ovVi"></div>
        <div class="ovsen" id="ovSen"></div>
      </div>
      <button class="btn soft" id="ovSpeak">🔊 Listen</button>
      <button class="btn go" id="ovNext">Next ▶</button>
    </div>
  </div>
</div>

<div class="ov" id="win">
  <div class="winbox">
    <div class="trophy">🏆</div>
    <h2>Excellent!</h2>
    <div class="winstars" id="winStars"></div>
    <p id="winMsg"></p>
    <div class="keys" id="keys"></div>
    <button class="btn orange" id="again">🔄 Play again</button>
  </div>

const WORDS = [
  {n:1, key:'dogsled', word:'dogsled',       vi:'xe trượt tuyết do chó kéo', icon:'🐕', color:'pink',   pic:'e',
   sen:'The dogs pull the sled across the snow.'},
  {n:2, key:'crafts',  word:'making crafts', vi:'làm đồ thủ công',          icon:'✂️', color:'green',  pic:'d',
   sen:'We cut and glue colourful paper.'},
  {n:3, key:'art',     word:'native art',    vi:'nghệ thuật bản địa',       icon:'🏺', color:'blue',   pic:'c',
   sen:'Native art has bright colours and patterns.'},
  {n:4, key:'weaving', word:'weaving',       vi:'dệt vải',                  icon:'🧶', color:'purple', pic:'a',
   sen:'She weaves colourful cloth on a loom.'},
  {n:5, key:'dance',   word:'tribal dance',  vi:'điệu múa của bộ lạc',      icon:'🥁', color:'yellow', pic:'b',
   sen:'They dance and play the drums together.'},
];
const PICS = [
  {letter:'a', color:'pink'}, {letter:'b', color:'green'}, {letter:'c', color:'blue'},
  {letter:'d', color:'purple'}, {letter:'e', color:'blue'}
];

const $ = s => document.querySelector(s);
const board = $('#board'), linesSvg = $('#lines');
let state = {selected:null, matched:{}, misses:0, order:WORDS.map((_,i)=>i)};
let soundOn = true;
const wordEls = {}, picEls = {};

/* ---------------- Build board ---------------- */
function build(){
  board.querySelectorAll('.word,.pic').forEach(e=>e.remove());
  state.order.forEach((wi,row)=>{
    const w = WORDS[wi];
    const el = document.createElement('div');
    el.className = 'word c-'+w.color;
    el.style.gridRow = row+1;
    el.innerHTML = `<div class="num">${w.n}</div><div class="icon">${w.icon}</div><div class="txt">${w.word}</div><div class="dot"></div>`;
    el.dataset.key = w.key;
    board.appendChild(el);
    wordEls[w.key] = el;
    el.addEventListener('pointerdown', e=>onWordDown(e, w));
  });
  PICS.forEach((p,row)=>{
    const el = document.createElement('div');
    el.className = 'pic c-'+p.color;
    el.style.gridRow = row+1;
    el.dataset.letter = p.letter;
    el.innerHTML = `<div class="imgbox"><img src="${IMG[p.letter]}" alt="picture ${p.letter}" draggable="false"></div>
      <div class="letter">${p.letter}</div><div class="replay">▶ Xem lại</div><div class="dot"></div>`;
    board.appendChild(el);
    picEls[p.letter] = el;
    el.addEventListener('click', ()=>onPicClick(p.letter));
  });
  renderStars();
}

function renderStars(){
  const n = Object.keys(state.matched).length;
  $('#stars').innerHTML = WORDS.map((_,i)=>`<span class="${i<n?'on':''}">⭐</span>`).join('');
  $('#miss').textContent = '❌ ' + state.misses;
}

/* ---------------- Lines ---------------- */
function pt(el, side){
  const d = el.querySelector('.dot').getBoundingClientRect();
  const b = board.getBoundingClientRect();
  return {x:d.left + d.width/2 - b.left, y:d.top + d.height/2 - b.top};
}
function curve(a,b){
  const dx = Math.max(30, Math.abs(b.x-a.x)*.45);
  return `M${a.x},${a.y} C${a.x+dx},${a.y} ${b.x-dx},${b.y} ${b.x},${b.y}`;
}
function drawLines(){
  let html = '';
  for (const key in state.matched){
    const a = pt(wordEls[key]), b = pt(picEls[state.matched[key]]);
    html += `<path d="${curve(a,b)}" stroke="#fff" stroke-width="11" fill="none" stroke-linecap="round"/>
             <path d="${curve(a,b)}" stroke="#1fae4b" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  }
  if (temp) html += `<path d="${curve(temp.a,temp.b)}" stroke="${temp.color||'#1f8fe0'}" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="${temp.color?'0':'12 9'}"/>`;
  linesSvg.innerHTML = html;
}
let temp = null;
window.addEventListener('resize', drawLines);

/* ---------------- Interaction ---------------- */
let drag = null, ignoreClick = 0;
function onWordDown(e, w){
  if (state.matched[w.key] !== undefined){ speak(w.word); return; }
  e.preventDefault();
  unlockAudio();
  select(w.key);
  drag = {w, x0:e.clientX, y0:e.clientY, moved:false};
}
window.addEventListener('pointermove', e=>{
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX-drag.x0, e.clientY-drag.y0) > 10) drag.moved = true;
  if (drag.moved){
    const b = board.getBoundingClientRect();
    temp = {a:pt(wordEls[drag.w.key]), b:{x:e.clientX-b.left, y:e.clientY-b.top}};
    document.querySelectorAll('.pic.target').forEach(p=>p.classList.remove('target'));
    const over = document.elementFromPoint(e.clientX, e.clientY);
    const pic = over && over.closest('.pic');
    if (pic) pic.classList.add('target');
    drawLines();
  }
});
window.addEventListener('pointerup', e=>{
  if (!drag) return;
  const d = drag; drag = null;
  document.querySelectorAll('.pic.target').forEach(p=>p.classList.remove('target'));
  if (d.moved){
    temp = null; drawLines();
    const over = document.elementFromPoint(e.clientX, e.clientY);
    const pic = over && over.closest('.pic');
    ignoreClick = Date.now();
    if (pic) attempt(d.w.key, pic.dataset.letter);
  } else {
    speak(d.w.word);
  }
});
window.addEventListener('pointercancel', ()=>{ drag=null; temp=null; drawLines(); });

function select(key){
  state.selected = key;
  Object.values(wordEls).forEach(el=>el.classList.toggle('selected', el.dataset.key===key));
  tone(660,.06,'sine',.12);
}
function deselect(){
  state.selected = null;
  Object.values(wordEls).forEach(el=>el.classList.remove('selected'));
}
function onPicClick(letter){
  if (Date.now()-ignoreClick < 300) return;
  unlockAudio();
  const matchedKey = Object.keys(state.matched).find(k=>state.matched[k]===letter);
  if (matchedKey){ openScene(matchedKey); return; }
  if (!state.selected){
    toast('👆 Choose a word first! · Hãy chọn một từ trước nhé!');
    picEls[letter].classList.remove('shake'); void picEls[letter].offsetWidth; picEls[letter].classList.add('shake');
    return;
  }
  attempt(state.selected, letter);
}

function addMark(el, ok){
  el.querySelectorAll('.mark').forEach(m=>m.remove());
  const m = document.createElement('div');
  m.className = 'mark ' + (ok?'ok':'no');
  m.textContent = ok ? '✔' : '✖';
  el.appendChild(m);
  return m;
}

function attempt(key, letter){
  const w = WORDS.find(x=>x.key===key);
  const wEl = wordEls[key], pEl = picEls[letter];
  const taken = Object.values(state.matched).includes(letter);
  if (w.pic === letter && !taken){
    state.matched[key] = letter;
    deselect();
    wEl.classList.add('matched'); pEl.classList.add('matched');
    addMark(wEl,true); addMark(pEl,true);
    drawLines(); renderStars();
    sfxCorrect();
    toast('✔ Correct! · Chính xác!', 'good');
    setTimeout(()=>openScene(key), 650);
  } else {
    state.misses++; renderStars();
    deselect();
    const m1 = addMark(wEl,false), m2 = addMark(pEl,false);
    [wEl,pEl].forEach(el=>{ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); });
    temp = {a:pt(wEl), b:pt(pEl), color:'#e53935'}; drawLines();
    sfxWrong();
    toast('✖ Not quite! Try again · Chưa đúng, thử lại nhé!', 'bad');
    setTimeout(()=>{ m1.remove(); m2.remove(); temp=null; drawLines(); }, 1300);
  }
}

let toastT;
function toast(msg, kind=''){
  const t = $('#toast');
  t.textContent = msg; t.className = 'toast show ' + kind;
  clearTimeout(toastT); toastT = setTimeout(()=>t.className='toast '+kind, 1800);
}

/* ---------------- Audio ---------------- */
let AC = null, sceneBus = null;
function unlockAudio(){
  try{
    if (!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  }catch(e){}
}
function out(){ return sceneBus || (AC && AC.destination); }
function tone(f, dur, type='sine', vol=.15, when=0, dest){
  if (!soundOn || !AC) return;
  const t = AC.currentTime + when;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(dest || AC.destination);
  o.start(t); o.stop(t+dur+.05);
}
function sfxCorrect(){ [523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.18,i*.09)); }
function sfxWrong(){ tone(240,.2,'square',.07,0); tone(170,.32,'square',.07,.17); }
function drum(when, f=150){
  if (!soundOn || !AC || !sceneBus) return;
  const t = AC.currentTime + when;
  const o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(48, t+.25);
  g.gain.setValueAtTime(.55, t); g.gain.exponentialRampToValueAtTime(0.001, t+.3);
  o.connect(g); g.connect(sceneBus); o.start(t); o.stop(t+.35);
}
function noise(when, dur=.06, vol=.25, hp=2500){
  if (!soundOn || !AC || !sceneBus) return;
  const t = AC.currentTime + when;
  const buf = AC.createBuffer(1, AC.sampleRate*dur, AC.sampleRate);
  const ch = buf.getChannelData(0);
  for (let i=0;i<ch.length;i++) ch[i] = (Math.random()*2-1)*(1-i/ch.length);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = buf; f.type = 'highpass'; f.frequency.value = hp; g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(sceneBus); s.start(t);
}
function sceneSound(key){
  if (!AC || !soundOn) return;
  sceneBus = AC.createGain(); sceneBus.gain.value = 1; sceneBus.connect(AC.destination);
  const B = sceneBus;
  if (key==='dogsled'){
    for (let i=0;i<26;i++) noise(i*.13, .05, .18, 600);
    [0, .9, 1.8].forEach(t=>{ tone(880,.12,'triangle',.08,t+.6,B); tone(1175,.12,'triangle',.08,t+.7,B); });
  } else if (key==='crafts'){
    for (let i=0;i<10;i++) noise(i*.34, .05, .3, 3500);
    [.3,1,1.7,2.3].forEach((t,i)=>tone(600+i*150,.18,'sine',.15,t+.5,B));
  } else if (key==='art'){
    for (let i=0;i<8;i++) noise(i*.18, .2, .05, 1200);
    [1.4,1.6,1.8,2,2.2,2.4].forEach((t,i)=>tone([784,988,1175,1319,1568,1760][i],.25,'sine',.1,t,B));
  } else if (key==='weaving'){
    for (let i=0;i<13;i++){ tone(330+ (i%2)*40,.05,'triangle',.12,i*.3,B); noise(i*.3+.28,.03,.15,1800); }
    tone(784,.3,'triangle',.15,4.0,B); tone(1047,.4,'triangle',.15,4.15,B);
  } else if (key==='dance'){
    for (let i=0;i<14;i++){ drum(i*.36, i%2?110:160); if (i%2===0) noise(i*.36+.18,.04,.12,5000); }
  }
}
function stopSceneSound(){
  if (sceneBus){ try{ sceneBus.gain.value = 0; sceneBus.disconnect(); }catch(e){} sceneBus = null; }
}
function speak(text){
  if (!soundOn || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = .85;
    const v = speechSynthesis.getVoices().find(v=>/^en[-_](US|GB)/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();

/* ---------------- Scenes (SVG) ---------------- */
const R = (a,b)=>a+Math.random()*(b-a);

function sceneArt(){
  const W = (base, A, phase)=>{ let d=''; for (let x=0;x<=800;x+=10){ const y = base + A*Math.sin(x/800*Math.PI*3 + phase); d += (x?' L':'M')+x+','+y.toFixed(1);} return d; };
  const yAt = (x, base, A, phase)=> base + A*Math.sin(x/800*Math.PI*3 + phase);
  const bands = [
    {base:262, w:46, c:'#1b1b1b', p:0},
    {base:302, w:30, c:'#f39a1e', p:0},
    {base:336, w:34, c:'#1f7a6a', p:0},
    {base:372, w:34, c:'#d63a1a', p:0},
    {base:414, w:46, c:'#f2c12e', p:0},
  ];
  let bandSvg = bands.map((b,i)=>`<path class="na-draw" pathLength="1" d="${W(b.base,30,b.p)}" stroke="${b.c}" stroke-width="${b.w}" fill="none" style="animation-delay:${(i*.22).toFixed(2)}s"/>`).join('');
  let deco = '';
  for (let i=0,x=20;x<800;x+=40,i++){ const y=yAt(x,262,30,0); deco += `<g transform="translate(${x},${y.toFixed(1)})"><polygon class="pop" points="-11,9 0,-11 11,9" fill="#fff" style="animation-delay:${(1.5+i*.04).toFixed(2)}s"/></g>`; }
  for (let i=0,x=40;x<800;x+=80,i++){ const y=yAt(x,372,30,0); deco += `<g transform="translate(${x},${y.toFixed(1)})"><g class="pop" style="animation-delay:${(1.9+i*.07).toFixed(2)}s"><circle r="13" fill="#fff"/><circle r="7" fill="#d63a1a"/><circle r="3" fill="#1b1b1b"/></g></g>`; }
  for (let i=0,x=20;x<800;x+=36,i++){ const y=yAt(x,414,30,0); deco += `<g transform="translate(${x},${y.toFixed(1)})"><polygon class="pop" points="0,-10 8,0 0,10 -8,0" fill="#1b1b1b" style="animation-delay:${(2.3+i*.03).toFixed(2)}s"/></g>`; }
  for (let i=0,x=10;x<800;x+=24,i++){ const y=yAt(x,302,30,0); deco += `<g transform="translate(${x},${y.toFixed(1)})"><circle class="pop" r="3.5" fill="#fff" style="animation-delay:${(2.6+i*.02).toFixed(2)}s"/></g>`; }
  let spiral = 'M0,0';
  for (let t=0;t<=Math.PI*6.2;t+=.2){ const r=2+t*2.6; spiral += ` L${(r*Math.cos(t)).toFixed(1)},${(r*Math.sin(t)).toFixed(1)}`; }
  let rays = '';
  for (let i=0;i<14;i++){ const a=i/14*360; rays += `<polygon points="-7,-72 7,-72 0,-90" fill="#f57c1f" transform="rotate(${a})"/>`; }
  const zig = (x0,y0,c,n,del)=>{ let d=`M${x0},${y0}`; for (let i=1;i<=n;i++) d+=` L${x0+i*24},${y0+(i%2?-22:0)}`; return `<path class="na-draw" pathLength="1" d="${d}" stroke="${c}" stroke-width="7" fill="none" stroke-linejoin="round" style="animation-delay:${del}s"/>`; };
  return `<svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
  <rect width="800" height="450" fill="#fbf1dc"/>
  ${zig(30,70,'#1b1b1b',9,.2)}${zig(30,110,'#e8401c',9,.5)}${zig(30,150,'#1f7a6a',9,.8)}
  ${zig(552,70,'#1b1b1b',9,.35)}${zig(552,110,'#e8401c',9,.65)}${zig(552,150,'#1f7a6a',9,.95)}
  <g transform="translate(400,112)"><g class="pop">
    <g class="pulse">${rays}</g>
    <circle r="62" fill="#f9b21b"/>
    <g class="spin"><path d="${spiral}" stroke="#e8401c" stroke-width="8" fill="none" stroke-linecap="round"/></g>
  </g></g>
  ${bandSvg}
  ${deco}
  <g transform="translate(0,262)"><g class="na-bx"><g class="na-by"><text x="-6" y="-8" font-size="54">🖌️</text></g></g></g>
  <text class="float" x="700" y="230" font-size="52" style="animation-delay:-.5s">🎨</text>
  </svg>`;
}

function sceneWeaving(){
  const base = ['#ff5a1f','#ff5a1f','#4b2a9e','#4b2a9e','#4b2a9e','#4b2a9e','#4b2a9e','#4b2a9e','#4b2a9e','#4b2a9e','#4b2a9e','#ff5a1f','#ff5a1f'];
  let rows = '';
  for (let i=0;i<13;i++){
    const y = 392 - 24*(i+1);
    let motif = '';
    const d = Math.abs(i-6);
    if (i>=2 && i<=10){
      const big = (5-d)*44+12, small=(5-d)*14+6;
      motif += `<rect x="${400-big/2}" y="${y+3}" width="${big}" height="18" fill="#ff8c1a"/>`;
      motif += `<rect x="${400-big/2+16}" y="${y+3}" width="${Math.max(0,big-32)}" height="18" fill="#4b2a9e"/>`;
      motif += `<rect x="${225-small/2}" y="${y+3}" width="${small}" height="18" fill="#f2c12e"/>`;
      motif += `<rect x="${575-small/2}" y="${y+3}" width="${small}" height="18" fill="#f2c12e"/>`;
    }
    if (i===1 || i===11) motif += `<rect x="162" y="${y+9}" width="476" height="6" fill="#f2c12e"/>`;
    rows += `<g class="wv-row ${i%2?'r':'l'}" style="animation-delay:${(i*.3).toFixed(1)}s"><rect x="162" y="${y}" width="476" height="24" fill="${base[i]}"/>${motif}</g>`;
  }
  let warp = '', warp2 = '';
  for (let x=168;x<=632;x+=9){ warp += `<line x1="${x}" y1="56" x2="${x}" y2="394" stroke="#efe3c8" stroke-width="2"/>`; warp2 += `<line x1="${x}" y1="80" x2="${x}" y2="392" stroke="rgba(255,255,255,.16)" stroke-width="1.6"/>`; }

  <rect x="640" y="30" width="20" height="388" rx="8" fill="#9c6a35"/>
  ${warp}
  ${rows}
  ${warp2}
  <g transform="translate(0,380)"><g class="wv-up">
    <rect x="150" y="-20" width="500" height="8" rx="4" fill="#b98a55" opacity=".9"/>
    <g class="wv-x"><g transform="translate(165,0)">
      <path d="M-40,0 Q-22,-13 0,-13 Q22,-13 40,0 Q22,13 0,13 Q-22,13 -40,0Z" fill="#b97a3c" stroke="#7a4a1d" stroke-width="2"/>
      <rect x="-14" y="-6" width="28" height="12" rx="5" fill="#f2c12e"/>
    </g></g>
  </g></g>
  <g transform="translate(80,380)"><g class="spin"><text x="-34" y="22" font-size="64">🧶</text></g></g>
  <path d="M112,368 C150,330 140,300 162,292" stroke="#e8401c" stroke-width="3" fill="none"/>
  <text class="wv-done" x="700" y="120" font-size="56">✨</text>
  <text class="wv-done" x="60" y="140" font-size="44" style="animation-delay:4.2s">⭐</text>

}

    .map(([x,y,t,d])=>`<text class="note" x="${x}" y="${y}" font-size="34" style="animation-delay:${d}s">${t}</text>`).join('');
  return `<svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice">
  <defs><linearGradient id="sky5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fb8f5"/><stop offset="1" stop-color="#cdeeff"/></linearGradient></defs>
  <rect width="800" height="450" fill="url(#sky5)"/>
  <circle cx="700" cy="70" r="36" fill="#ffe066"/><circle class="pulse" cx="700" cy="70" r="48" fill="#ffe066" opacity=".3"/>
  <g class="cloud"><ellipse cx="160" cy="70" rx="60" ry="18" fill="#fff"/><ellipse cx="200" cy="58" rx="38" ry="18" fill="#fff"/><ellipse cx="460" cy="50" rx="50" ry="14" fill="#fff" opacity=".9"/></g>
  <polygon points="430,250 560,120 690,230 800,160 800,260 430,260" fill="#7fa6c9"/>
  <ellipse cx="150" cy="320" rx="320" ry="130" fill="#2e8b3e"/>
  <ellipse cx="620" cy="330" rx="340" ry="110" fill="#3a9d48"/>
  ${[60,110,700,750].map((x,i)=>`<circle cx="${x}" cy="${250+i%2*10}" r="${22+i%2*8}" fill="#1f6e2f"/>`).join('')}
  <rect y="330" width="800" height="120" fill="#6cc644"/>
  ${[350,380,410,440].map(y=>`<rect y="${y}" width="800" height="12" fill="#7bd252" opacity=".6"/>`).join('')}
  ${dancer(150,0)}${dancer(320,-.18)}${dancer(490,-.09)}${dancer(660,-.27)}
  <text class="dn-boom" x="230" y="120" font-size="48" font-weight="900" fill="#ffd23f" stroke="#c0392b" stroke-width="4" paint-order="stroke" text-anchor="middle">BOOM!</text>
  <text class="dn-boom" x="560" y="150" font-size="44" font-weight="900" fill="#fff" stroke="#e76f51" stroke-width="4" paint-order="stroke" text-anchor="middle" style="animation-delay:.72s">DUM!</text>
  ${notes}
  </svg>`;
}
const SCENES = {dogsled:sceneDogsled, crafts:sceneCrafts, art:sceneArt, weaving:sceneWeaving, dance:sceneDance};

/* ---------------- Overlay ---------------- */
let currentScene = null;
function openScene(key){
  const w = WORDS.find(x=>x.key===key);
  currentScene = key;
  $('#stage').innerHTML = SCENES[key]();
  $('#ovWord').innerHTML = `${w.n}. ${w.word} <em>→ ${w.pic}</em>`;
  $('#ovVi').textContent = '🇻🇳 ' + w.vi;
  $('#ovSen').textContent = '💬 ' + w.sen;
  $('#ovNext').textContent = allDone() ? 'Finish 🏁' : 'Next ▶';
  $('#ov').classList.add('show');
  stopSceneSound(); sceneSound(key);
  setTimeout(()=>speak(w.word), 300);
}
function closeScene(){
  $('#ov').classList.remove('show');
  $('#stage').innerHTML = '';
  stopSceneSound();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (allDone()) setTimeout(showWin, 250);
}
function allDone(){ return Object.keys(state.matched).length === WORDS.length; }
$('#ovNext').onclick = closeScene;
$('#ovSpeak').onclick = ()=>{ const w = WORDS.find(x=>x.key===currentScene); speak(w.word + '. ' + w.sen); };
$('#ov').addEventListener('click', e=>{ if (e.target.id==='ov') closeScene(); });

let winShown = false;
function showWin(){
  if (winShown) return; winShown = true;
  const m = state.misses, s = m===0?3:m<=2?2:1;
  $('#winStars').innerHTML = [0,1,2].map(i=>`<span class="${i<s?'':'off'}" style="animation-delay:${i*.2}s">⭐</span>`).join('');
  $('#winMsg').innerHTML = m===0 ? 'Perfect! No mistakes! 🎉<br><small>Tuyệt vời! Không sai câu nào!</small>'
    : `You matched all 5 with ${m} mistake${m>1?'s':''}.<br><small>Em đã nối đúng cả 5 cặp, sai ${m} lần.</small>`;
  $('#keys').innerHTML = WORDS.map(w=>`<span>${w.n} – ${w.pic}</span>`).join('');
  $('#win').classList.add('show');
  confetti(120);
  [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',.16,i*.12));
  speak('Excellent! Well done!');
}
function confetti(n){
  const colors = ['#ff5c9a','#ffd23f','#4cc9f0','#7ae582','#ff8a2a','#8a55d6'];
  for (let i=0;i<n;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw';
    c.style.background = colors[i%colors.length];
    c.style.animationDuration = R(2.2,4.2) + 's';
    c.style.animationDelay = R(0,.8) + 's';
    c.style.transform = `rotate(${R(0,360)}deg)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 5200);
  }
}
function reset(shuffle=true){
  state = {selected:null, matched:{}, misses:0, order:WORDS.map((_,i)=>i)};
  if (shuffle) for (let i=state.order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [state.order[i],state.order[j]]=[state.order[j],state.order[i]]; }
  winShown = false; temp = null;
  $('#win').classList.remove('show');
  build(); drawLines();
}
$('#again').onclick = ()=>reset(true);
$('#btnReset').onclick = ()=>reset(true);
$('#btnSound').onclick = ()=>{ soundOn = !soundOn; $('#btnSound').textContent = soundOn?'🔊':'🔇'; if(!soundOn){ stopSceneSound(); if('speechSynthesis' in window) speechSynthesis.cancel(); } };
$('#btnFull').onclick = ()=>{
  const d = document;
  if (!d.fullscreenElement) (d.documentElement.requestFullscreen||d.documentElement.webkitRequestFullscreen||(()=>{})).call(d.documentElement);
  else (d.exitFullscreen||d.webkitExitFullscreen).call(d);
};
document.addEventListener('fullscreenchange', ()=>setTimeout(drawLines,200));
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && $('#ov').classList.contains('show')) closeScene(); });

build();
window.addEventListener('load', drawLines);
</script>
</body>
</html>
